[package]
name = "loop-retry"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Generic async retry with exponential backoff and jitter"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/loop-retry"

[dependencies]
tokio = { version = "1", features = ["time"] }
rand = "0.9"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints.rust]
unsafe_code = "forbid"
